[project]
name = "skystore"
version = "0.1.0"
description = "Django catalog project"
authors = [
    {name = "Nikita Rukin"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"

[tool.poetry]
packages = [{include = "catalog"}]

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0.7"
django-crispy-forms = "^2.6"
crispy-bootstrap5 = "^2026.3"
django-extensions = "^4.1"
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"