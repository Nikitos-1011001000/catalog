{% extends 'catalog/base.html' %}

{% block content %}
<h1>Товары категории</h1>

{% for product in products %}
  <div>
    <h2>{{ product.name }}</h2>
    <p>{{ product.description }}</p>
    <p>{{ product.price }}</p>
  </div>
{% empty %}
  <p>Товаров в этой категории нет.</p>
{% endfor %}
{% endblock %}
